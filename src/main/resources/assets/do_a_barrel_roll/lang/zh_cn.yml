  category.do_a_barrel_roll.do_a_barrel_roll: 完成一个桶滚动作
  bind.do_a_barrel_roll:
    pitch_up: 抬高俯仰
    pitch_down: 降低俯仰
    yaw_left: 左偏航
    yaw_right: 右偏航
    roll_left: 左滚转
    roll_right: 右滚转
    thrust_forward: 向前推进
    thrust_backward: 向后推进